name: Android APK (PoC)

on:
  push:
    branches:
      - android-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Runner smoke test
        run: Write-Host "runner ready"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm ci
      - name: Build Drawnix web app
        run: npm run build:web
      - name: Install Capacitor tooling
        run: npm install --no-save --package-lock=false @capacitor/core@8.2.0 @capacitor/android@8.2.0 @capacitor/cli@8.2.0
      - name: Generate Android project
        run: |
          if (!(Test-Path 'android')) { npx cap add android }
          npx cap sync android
      - name: Build debug APK
        run: |
          Set-Location android
          .\gradlew.bat assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drawnix-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
